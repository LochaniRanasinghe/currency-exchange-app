name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy and Setup Server
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            # --- VARIABLES ---
            REPO_URL="https://x-access-token:$GITHUB_TOKEN@github.com/LochaniRanasinghe/currency-exchange-app.git"
            PROJECT_DIR="/home/ubuntu/currency-exchange-app"

            # --- STEP 1: INSTALL DOCKER (If not installed) ---
            if ! command -v docker &> /dev/null; then
                echo "Docker not found. Installing..."
                sudo apt-get update
                sudo apt-get install -y docker.io docker-compose
                sudo usermod -aG docker $USER
                echo "Docker installed."
            else
                echo "Docker is already installed."
            fi

            # --- STEP 2: CLONE OR PULL CODE ---
            if [ ! -d "$PROJECT_DIR" ]; then
                echo "Project folder not found. Cloning..."
                git clone $REPO_URL $PROJECT_DIR
            else
                echo "Project folder exists. Pulling latest code..."
                cd $PROJECT_DIR
                git remote set-url origin $REPO_URL
                git pull origin main
            fi

            # --- STEP 3: DEPLOY APP ---
            cd $PROJECT_DIR

            # Write the .env file from Secrets
            echo "${{ secrets.ENV_FILE }}" > .env

            # Stop and remove containers (but keep volumes!)

            echo "Stopping existing containers..."
            sudo docker-compose down || true

            # Remove any orphaned db container to avoid name conflict
            echo "Removing any existing db container to avoid name conflict..."
            sudo docker rm -f currency_exchange_db || true

            # Clean up old unused images only (not volumes!)
            sudo docker image prune -f

            # Start Containers
            sudo docker-compose up -d --build

            # Wait for all services to be healthy (not just "Up")
            echo "Waiting for all services to be healthy..."
            timeout=180
            elapsed=0
            while [ $elapsed -lt $timeout ]; do
                if sudo docker-compose ps | grep -q "(healthy)"; then
                    healthy_count=$(sudo docker-compose ps | grep -c "(healthy)" || echo 0)
                    if [ $healthy_count -ge 2 ]; then
                        echo "All critical services are healthy!"
                        break
                    fi
                fi
                echo "Waiting for services to become healthy... ($elapsed/$timeout seconds)"
                sleep 5
                elapsed=$((elapsed + 5))
            done

            # Verify containers are running and healthy
            echo "Final container status:"
            sudo docker-compose ps
            if ! sudo docker-compose ps | grep -q "(healthy)"; then
                echo "ERROR: Services did not become healthy in time!"
                sudo docker-compose logs
                exit 1
            fi

            # --- STEP 4: LARAVEL SETUP & PERMISSION FIX ---
            echo "Configuring git safe directory..."
            sudo docker-compose exec -T app git config --global --add safe.directory /var/www

            # 1. Force clean vendor folder (both in container and on host)
            echo "Force cleaning vendor folder..."
            sudo rm -rf $PROJECT_DIR/vendor
            sudo docker-compose exec -T app rm -rf /var/www/vendor

            # 2. Install Dependencies with fresh cache
            echo "Installing Composer dependencies (production only)..."
            sudo docker-compose exec -T app composer install \
                --no-dev \
                --optimize-autoloader \
                --no-interaction \
                --prefer-dist \
                --no-scripts || {
                echo "ERROR: Composer install failed!"
                echo "Attempting to clear composer cache and retry..."
                sudo docker-compose exec -T app composer clear-cache
                sudo docker-compose exec -T app composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts || {
                    echo "ERROR: Composer install failed after retry!"
                    sudo docker-compose exec -T app composer diagnose
                    exit 1
                }
            }

            # 3. Run post-install scripts manually
            echo "Running post-install scripts..."
            sudo docker-compose exec -T app composer dump-autoload --optimize --no-dev
            sudo docker-compose exec -T app php artisan package:discover --ansi
            echo "Composer install completed successfully."

            # 2. Run Migrations & Cache
            echo "Running database migrations..."
            sudo docker-compose exec -T app php artisan migrate --force || {
                echo "ERROR: Migration failed!"
                exit 1
            }
            echo "Caching configuration..."
            sudo docker-compose exec -T app php artisan config:cache
            sudo docker-compose exec -T app php artisan route:cache
            sudo docker-compose exec -T app php artisan view:cache

            # 3. CRITICAL FIX: Change Ownership to www-data
            # This fixes the issue where Nginx cannot read the 'vendor' folder
            echo "Fixing ownership and permissions..."
            sudo docker-compose exec -T app chown -R www-data:www-data /var/www/vendor
            sudo docker-compose exec -T app chown -R www-data:www-data /var/www/storage
            sudo docker-compose exec -T app chown -R www-data:www-data /var/www/bootstrap/cache

            # 4. Ensure directories are writable
            sudo docker-compose exec -T app chmod -R 775 /var/www/storage /var/www/bootstrap/cache
            echo "Permissions fixed successfully."

            # 5. Restart Queue Worker (To load new code/vendor files)
            sudo docker-compose restart worker

            echo "Deployment Finished Successfully!"
