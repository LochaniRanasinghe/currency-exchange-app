name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy and Setup Server
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e

            # --- VARIABLES ---
            REPO_URL="https://x-access-token:$GITHUB_TOKEN@github.com/LochaniRanasinghe/currency-exchange-app.git"
            PROJECT_DIR="/home/ubuntu/currency-exchange-app-main"

            # --- STEP 1: INSTALL DOCKER (WITHOUT docker-compose v1) ---
            if ! command -v docker &> /dev/null; then
                echo "Docker not found. Installing Docker..."
                sudo apt-get update
                sudo apt-get install -y docker.io
                sudo systemctl start docker
                sudo systemctl enable docker
                sudo usermod -aG docker $USER
                echo "Docker installed successfully."
            else
                echo "Docker already installed."
            fi

            # --- VERIFY DOCKER COMPOSE v2 ---
            docker compose version

            # --- STEP 2: CLONE OR PULL CODE ---
            if [ ! -d "$PROJECT_DIR" ]; then
                echo "Project folder not found. Cloning..."
                git clone $REPO_URL $PROJECT_DIR
            else
                echo "Project folder exists. Pulling latest code..."
                cd $PROJECT_DIR
                git remote set-url origin $REPO_URL
                git pull origin main
            fi

            # --- STEP 3: DEPLOY APP ---
            cd $PROJECT_DIR

            echo "Stopping and cleaning old containers..."
            sudo docker compose down -v --remove-orphans || true

            echo "Cleaning unused Docker resources..."
            sudo docker system prune -a -f --volumes

            # Write the .env file from GitHub Secrets
            echo "${{ secrets.ENV_FILE }}" > .env

            echo "Starting containers with Docker Compose v2..."
            sudo docker compose up -d --build

            # Wait for DB to be ready
            echo "Waiting 30 seconds for Database to start..."
            sleep 30

            # --- LARAVEL SETUP ---
            sudo docker compose exec -T app composer install --no-dev --optimize-autoloader
            sudo docker compose exec -T app php artisan migrate --force
            sudo docker compose exec -T app php artisan config:cache
            sudo docker compose exec -T app php artisan route:cache
            sudo docker compose exec -T app php artisan view:cache
            sudo docker compose exec -T app php artisan queue:restart
            sudo docker compose exec -T app chmod -R 777 storage bootstrap/cache

            echo "✅ Deployment Finished Successfully!"
