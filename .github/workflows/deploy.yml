name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy and Setup Server
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e

            # -----------------------------
            # VARIABLES
            # -----------------------------
            REPO_URL="https://x-access-token:$GITHUB_TOKEN@github.com/LochaniRanasinghe/currency-exchange-app.git"
            PROJECT_DIR="/home/ubuntu/currency-exchange-app-main"

            # -----------------------------
            # STEP 1: INSTALL / ENSURE DOCKER + COMPOSE V2
            # -----------------------------
            echo "Installing / ensuring Docker and Docker Compose v2..."

            # Install Docker if missing
            if ! command -v docker &> /dev/null; then
                echo "Docker not found. Installing latest Docker..."
                sudo apt-get update
                sudo apt-get install -y ca-certificates curl gnupg lsb-release

                # Add Docker repo
                sudo mkdir -p /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                echo \
                  "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
                  | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

                sudo apt-get update
                sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

                sudo systemctl start docker
                sudo systemctl enable docker
                sudo usermod -aG docker $USER
            else
                echo "Docker already installed. Installing/updating Docker Compose v2 plugin..."
                sudo apt-get update
                sudo apt-get install -y docker-compose-plugin || true
            fi

            # Verify installation
            docker --version
            docker compose version

            # -----------------------------
            # STEP 2: CLONE OR UPDATE CODE
            # -----------------------------
            if [ ! -d "$PROJECT_DIR" ]; then
                echo "Project directory not found. Cloning repository..."
                git clone $REPO_URL $PROJECT_DIR
            else
                echo "Project directory exists. Pulling latest changes..."
                cd $PROJECT_DIR
                git remote set-url origin $REPO_URL
                git pull origin main
            fi

            # -----------------------------
            # STEP 3: DEPLOY APPLICATION
            # -----------------------------
            cd $PROJECT_DIR

            echo "Stopping existing containers (if any)..."
            sudo docker compose down -v --remove-orphans || true

            echo "Cleaning unused Docker resources..."
            sudo docker system prune -a -f --volumes

            echo "Writing .env file from GitHub Secrets..."
            echo "${{ secrets.ENV_FILE }}" > .env

            echo "Building and starting containers..."
            sudo docker compose up -d --build

            echo "Waiting 30 seconds for database startup..."
            sleep 30

            # -----------------------------
            # STEP 4: LARAVEL SETUP
            # -----------------------------
            sudo docker compose exec -T app composer install --no-dev --optimize-autoloader
            sudo docker compose exec -T app php artisan migrate --force
            sudo docker compose exec -T app php artisan config:cache
            sudo docker compose exec -T app php artisan route:cache
            sudo docker compose exec -T app php artisan view:cache
            sudo docker compose exec -T app php artisan queue:restart
            sudo docker compose exec -T app chmod -R 777 storage bootstrap/cache

            echo "✅ Deployment Finished Successfully!"
