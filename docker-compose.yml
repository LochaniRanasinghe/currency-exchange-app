version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: currency_exchange_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-currency_exchange}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      APP_DEBUG: "true"
      APP_ENV: development
    networks:
      - currency-network

  nginx:
    image: nginx:latest
    container_name: currency_exchange_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - currency-network

  db:
    image: mysql:8.0
    container_name: currency_exchange_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-currency_exchange}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/docker-entrypoint.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - currency-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: currency_exchange_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-root}
    depends_on:
      - db
    networks:
      - currency-network

volumes:
  dbdata:

networks:
  currency-network:
    driver: bridge
